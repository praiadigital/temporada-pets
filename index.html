<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Temporada Pets — Praia Digital</title><meta name="description" content="Checklist e diferenciais para deixar seu imóvel de temporada pet-friendly no litoral."><link rel="canonical" href="https://praia.digital/temporada-pets/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}main{max-width:860px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px 0}label{display:block;padding:6px 0;cursor:pointer}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#0a58ca;color:#fff;text-decoration:none;font-weight:600}#score{font-size:40px;font-weight:800;color:#16a34a}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/area-anfitriao/" style="color:#9fd8ff;margin-right:12px">Área do Anfitrião</a><a href="https://praia.digital/pet-praia/" style="color:#9fd8ff;margin-right:12px">Pet Praia</a><a href="https://praia.digital/checklist-anfitriao/" style="color:#9fd8ff">Checklist Anfitrião</a></nav><main><h1>🐾 Temporada Pets</h1><p>Marque os itens que seu imóvel já tem e descubra seu <strong>score pet-friendly</strong>. Imóveis pet-friendly cobram em média 12% a mais na diária.</p><div class="card" id="items"></div><div class="card">Score: <span id="score">0</span>%<p id="msg"></p><a class="btn" href="https://praia.digital/preco-justo/">Recalcular minha diária</a></div></main><script>const I=['Portão/área segura para o pet','Piso frio ou vinílico fácil de limpar','Cama e potes disponíveis','Regras do condomínio permitem pets','Praia pet-friendly próxima','Kit de limpeza (tapete higiênico, sacos)','Veterinário 24h na região','Cobertura para danos no anúncio'];const c=document.getElementById('items');I.forEach((t,i)=>{c.innerHTML+='<label><input type="checkbox" onchange="go()"> '+t+'</label>'});function go(){const n=[...document.querySelectorAll('input')].filter(x=>x.checked).length;const s=Math.round(n/I.length*100);document.getElementById('score').textContent=s;document.getElementById('msg').textContent=s>=80?'Excelente! Destaque pet-friendly no título do anúncio.':s>=50?'Bom caminho — adicione mais itens para cobrar mais.':'Comece pelos itens básicos e atualize o anúncio.';}</script></body></html>
